<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio da Fábrica de Térmicos</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
  :root{
    --ground:#F4F6F6; --surface:#FFF; --surface-2:#EDF1F1; --surface-3:#E3EAEA;
    --ink:#141B1E; --ink-2:#3D4A50; --muted:#6B7B82;
    --line:#D9E0E1; --line-2:#C3CDCF;
    --accent:#0E6E6E; --accent-soft:#DCEDEC; --accent-ink:#0A5252;
    --ok:#2E7D4F; --ok-soft:#DFEFE5;
    --warn:#9A6512; --warn-soft:#F6EBD6;
    --crit:#AE352C; --crit-soft:#F7E0DE;
    --shadow:0 1px 2px rgba(20,27,30,.06),0 10px 26px -20px rgba(20,27,30,.35);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0D1214; --surface:#141B1E; --surface-2:#1B2427; --surface-3:#232E32;
      --ink:#EAEFEF; --ink-2:#B7C3C6; --muted:#849499;
      --line:#263237; --line-2:#33434A;
      --accent:#4FBDB4; --accent-soft:#12312F; --accent-ink:#7FD6CD;
      --ok:#5FBF87; --ok-soft:#122C1E;
      --warn:#D9A44E; --warn-soft:#2E2413;
      --crit:#E4796E; --crit-soft:#331A18;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -20px rgba(0,0,0,.9);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-size:14.5px;line-height:1.55;
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;text-wrap:balance}
  .shell{max-width:1240px;margin:0 auto;padding:0 22px 90px}

  header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .hd{max-width:1240px;margin:0 auto;padding:13px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .hd h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .hd .sub{font-size:12px;color:var(--muted)}
  .hd .right{margin-left:auto;display:flex;align-items:center;gap:9px}
  .badge{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid}
  .badge.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
  .badge.off{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}

  /* trilha de etapas */
  .trilha{display:flex;gap:4px;overflow-x:auto;padding:16px 0 4px}
  .pas{flex:1;min-width:112px;text-align:left;background:var(--surface);border:1px solid var(--line);
    border-top:3px solid var(--line-2);border-radius:6px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit}
  .pas:disabled{opacity:.45;cursor:not-allowed}
  .pas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pas .n{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);letter-spacing:.08em}
  .pas .t{display:block;font-size:12.5px;font-weight:500;margin-top:1px}
  .pas .s{font-size:10.5px;color:var(--muted)}
  .pas[data-st="feito"]{border-top-color:var(--ok)}
  .pas[data-st="feito"] .s{color:var(--ok)}
  .pas[aria-current="true"]{border-top-color:var(--accent);background:var(--accent-soft)}
  .pas[data-op="1"] .n::after{content:" · opcional"}

  .painel{background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);
    margin-top:16px;overflow:hidden}
  .p-hd{padding:16px 20px;border-bottom:1px solid var(--line)}
  .p-hd h2{font-size:18px;font-weight:600}
  .p-hd p{margin:5px 0 0;color:var(--ink-2);font-size:13.5px;max-width:74ch}
  .p-bd{padding:18px 20px}
  .p-ft{padding:13px 20px;border-top:1px solid var(--line);background:var(--surface-2);
    display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .p-ft .sp{margin-left:auto}

  .btn{font:inherit;font-size:13.5px;font-weight:500;padding:8px 16px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
  .btn:hover:not(:disabled){border-color:var(--muted)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--accent-ink);border-color:var(--accent-ink)}
  .btn.ghost{background:transparent;border-style:dashed}
  input.txt{font:inherit;font-size:14px;padding:9px 12px;border-radius:6px;border:1px solid var(--line-2);
    background:var(--surface);color:var(--ink);min-width:280px}
  input.txt:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

  .rot{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);display:block;margin-bottom:7px}

  /* grade de artes */
  .artes{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:11px}
  .arte{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px;cursor:pointer;
    text-align:left;font:inherit;color:inherit;display:grid;gap:6px}
  .arte:hover{border-color:var(--muted)}
  .arte:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .arte[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
  .arte img{width:100%;aspect-ratio:1/1.4;object-fit:contain;background:var(--surface);border-radius:4px;display:block}
  .arte b{font-size:11.5px;font-weight:500;line-height:1.3;word-break:break-word}
  .arte span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted)}

  /* saída de agente */
  .dupla{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:820px){.dupla{grid-template-columns:1fr}}
  .visual{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:9px}
  .visual img,.visual canvas{width:100%;display:block;border-radius:4px;background:var(--surface)}
  pre.out{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:13px;
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;
    word-break:break-word;max-height:420px;overflow:auto}
  pre.out.erro{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
  .resumo{display:grid;gap:8px;margin-bottom:12px}
  .kv{display:flex;gap:9px;align-items:baseline;font-size:13.5px}
  .kv b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);min-width:132px}
  .pilulas{display:flex;gap:5px;flex-wrap:wrap}
  .pil{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-2)}
  .pil.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
  .pil.no{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
  .pil.rm{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
  .swatches{display:flex;gap:4px;flex-wrap:wrap}
  .sw{width:26px;height:26px;border-radius:5px;border:1px solid var(--line-2)}

  /* camadas recortadas */
  .camadas{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .cam{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px;position:relative;
    cursor:pointer}
  .cam[aria-pressed="false"]{opacity:.32}
  .cam canvas{width:100%;aspect-ratio:1;object-fit:contain;display:block;
    background:repeating-conic-gradient(var(--surface-2) 0 25%, transparent 0 50%) 0 0/12px 12px}
  .cam small{display:block;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted)}

  /* máscaras */
  .mascaras{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:10px}
  .msk{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);
    border-radius:7px;padding:11px 12px;cursor:pointer;font:inherit;color:inherit;text-align:left}
  .msk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .msk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .msk .box{flex:none;width:38px;height:38px;display:grid;place-items:center}
  .msk .box i{display:block;background:var(--line-2);border-radius:2px}
  .msk[aria-pressed="true"] .box i{background:var(--accent)}
  .msk b{display:block;font-size:13px;font-weight:500}
  .msk span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}

  /* entrega */
  .entrega{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
  .ent{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .ent-hd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
  .ent-hd b{font-size:13px;font-weight:500}
  .ent-hd span{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);margin-left:auto}
  .ent .par{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .ent .par > div{background:var(--surface);padding:7px;display:grid;gap:5px}
  .ent .par small{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);text-align:center}
  .ent canvas,.ent img{width:100%;display:block;border-radius:3px;background:var(--surface-2)}
  .ent-ft{padding:8px 12px;display:flex;gap:7px}
  .ent-ft a{font:inherit;font-size:12px;color:var(--accent-ink);text-decoration:underline;cursor:pointer}

  #tresd{width:100%;height:400px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    display:block}
  .d3-bar{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}

  .aviso{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);border-radius:7px;
    padding:11px 14px;font-size:13.5px;margin-bottom:14px}
  .aviso.err{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
  .aviso[hidden]{display:none}
  .aviso code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:rgba(0,0,0,.08);padding:1px 5px;border-radius:3px}

  .vazio{color:var(--muted);font-size:13.5px;padding:20px 0;text-align:center}
  .carregando{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .spin{width:12px;height:12px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;
    animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);
    padding:9px 17px;border-radius:7px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);max-width:80vw}
  .toast[hidden]{display:none}
  .toast.err{background:var(--crit);color:#fff}
  details.crua{margin-top:12px}
  details.crua summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div>
      <h1>Estúdio da Fábrica de Térmicos</h1>
      <div class="sub">da capinha ao térmico, com o padrão fechado</div>
    </div>
    <div class="right">
      <span class="badge" id="b-token">…</span>
      <span class="mono" style="font-size:11px;color:var(--muted)" id="b-modelo"></span>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="trilha" id="trilha" aria-label="Etapas"></nav>
  <main id="palco"></main>
</div>

<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="/studio.js"></script>
</body>
</html>
