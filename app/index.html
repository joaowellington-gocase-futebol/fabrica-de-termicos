<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio da Fábrica de Térmicos</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('tema-termicos');
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap">
<style>
  :root,:root[data-theme="dark"]{
    --blue:#2659A5; --cyan:#3DBFEF; --pink:#E61782; --amber:#F8AE13; --lime:#D7D900;
    --radius:22px; --radius-sm:14px; --radius-pill:999px;
    --glass:blur(16px) saturate(150%);
    --shadow:0 18px 44px -22px rgba(9,22,48,.45);

    --ground:#070B15; --surface:rgba(21,28,46,.66); --surface-2:rgba(21,28,46,.42); --surface-3:rgba(255,255,255,.07);
    --ink:#EAEEF7; --ink-2:#C7CEDD; --muted:#9AA5BD;
    --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.22);
    --accent:#3DBFEF; --accent-soft:rgba(61,191,239,.14); --accent-ink:#7FD6CD;
    --accent-grad:linear-gradient(120deg,#2659A5,#3DBFEF);
    --ok:#5FBF87; --ok-soft:#122C1E;
    --warn:#D9A44E; --warn-soft:#2E2413;
    --crit:#E4796E; --crit-soft:#331A18;
    --toast-bg:rgba(21,28,46,.92);
    --code-bg:rgba(255,255,255,.08);
    --blob-blur:92px; --blob-alpha:.42;
  }
  :root[data-theme="light"]{
    --ground:#E9EEF7; --surface:rgba(255,255,255,.74); --surface-2:rgba(255,255,255,.55); --surface-3:rgba(16,26,46,.06);
    --ink:#101A2E; --ink-2:#33415C; --muted:#5A6478;
    --line:rgba(16,26,46,.13); --line-2:rgba(16,26,46,.22);
    --accent:#2659A5; --accent-soft:rgba(38,89,165,.10); --accent-ink:#184A8C;
    --accent-grad:linear-gradient(120deg,#2659A5,#3DBFEF);
    --ok:#2E7D4F; --ok-soft:#DFEFE5;
    --warn:#9A6512; --warn-soft:#F6EBD6;
    --crit:#AE352C; --crit-soft:#F7E0DE;
    --toast-bg:rgba(255,255,255,.92);
    --code-bg:rgba(16,26,46,.06);
    --blob-blur:84px; --blob-alpha:.50;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-size:14.5px;line-height:1.55;
    font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
    transition:background-color .2s,color .2s}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;text-wrap:balance}
  .shell{max-width:1240px;margin:0 auto;padding:0 22px 90px}

  /* fundo em aurora — mesmos blobs e ritmo do Mockup Studio */
  .bg{position:fixed;inset:-25vmax;z-index:-2;overflow:hidden;pointer-events:none}
  .blob{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(var(--blob-blur));
    opacity:var(--blob-alpha);will-change:transform}
  .blob:nth-child(1){top:2%;left:6%;background:radial-gradient(circle at 35% 35%,var(--blue),transparent 68%);
    animation:drift-a 27s ease-in-out infinite alternate}
  .blob:nth-child(2){top:30%;left:52%;background:radial-gradient(circle at 40% 40%,var(--cyan),transparent 66%);
    animation:drift-b 33s ease-in-out infinite alternate}
  .blob:nth-child(3){top:52%;left:14%;background:radial-gradient(circle at 45% 45%,var(--pink),transparent 64%);
    animation:drift-c 30s ease-in-out infinite alternate}
  .blob:nth-child(4){top:8%;left:68%;background:radial-gradient(circle at 50% 40%,var(--amber),transparent 62%);
    animation:drift-d 38s ease-in-out infinite alternate}
  .blob:nth-child(5){top:62%;left:62%;background:radial-gradient(circle at 40% 50%,var(--lime),transparent 60%);
    animation:drift-e 44s ease-in-out infinite alternate}
  @keyframes drift-a{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(14vmax,9vmax,0) scale(1.18)}}
  @keyframes drift-b{0%{transform:translate3d(0,0,0) scale(1.1)}100%{transform:translate3d(-16vmax,7vmax,0) scale(.9)}}
  @keyframes drift-c{0%{transform:translate3d(0,0,0) scale(.95)}100%{transform:translate3d(11vmax,-12vmax,0) scale(1.22)}}
  @keyframes drift-d{0%{transform:translate3d(0,0,0) scale(1.05)}100%{transform:translate3d(-12vmax,13vmax,0) scale(.88)}}
  @keyframes drift-e{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-9vmax,-10vmax,0) scale(1.15)}}
  .veil{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 0%,transparent,color-mix(in srgb,var(--ground) 72%,transparent))}

  header{background:color-mix(in srgb,var(--ground) 72%,transparent);backdrop-filter:var(--glass);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .hd{max-width:1240px;margin:0 auto;padding:13px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .brandline{display:flex;align-items:center;gap:13px}
  .brandline .logo{width:78px;height:22px;color:var(--ink);flex:none}
  :root[data-theme="light"] .brandline .logo{color:var(--blue)}
  .brandline .divider{width:1px;height:20px;background:var(--line);flex:none}
  .brandline .tool{font-size:12px;font-weight:600;letter-spacing:1.25px;text-transform:uppercase;color:var(--muted)}
  .hd .right{margin-left:auto;display:flex;align-items:center;gap:9px}
  .badge{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid}
  .badge.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
  .badge.off{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}

  #tema-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 12px;border-radius:var(--radius-pill);
    border:1px solid var(--line);background:var(--surface);backdrop-filter:var(--glass);cursor:pointer;
    font:600 12px/1 "Poppins",sans-serif;color:var(--ink);transition:border-color .2s,transform .2s,box-shadow .2s}
  #tema-btn:hover{border-color:var(--accent);box-shadow:0 8px 22px -12px color-mix(in srgb,var(--accent) 70%,transparent);
    transform:translateY(-1px)}
  #tema-btn svg{width:14px;height:14px;flex:none}
  #tema-btn .ic-sun{display:none}
  #tema-btn .ic-moon{display:block}
  :root[data-theme="dark"] #tema-btn .ic-sun{display:block}
  :root[data-theme="dark"] #tema-btn .ic-moon{display:none}

  .pagehead{margin-top:22px}
  .pagehead h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .pagehead .sub{font-size:12.5px;color:var(--muted);margin-top:4px}

  /* trilha de etapas */
  .trilha{display:flex;gap:4px;overflow-x:auto;padding:16px 0 4px}
  .pas{flex:1;min-width:112px;text-align:left;background:var(--surface-2);border:1px solid var(--line);
    border-top:3px solid var(--line-2);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit;
    backdrop-filter:var(--glass)}
  .pas:disabled{opacity:.45;cursor:not-allowed}
  .pas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pas .n{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);letter-spacing:.08em}
  .pas .t{display:block;font-size:12.5px;font-weight:500;margin-top:1px}
  .pas .s{font-size:10.5px;color:var(--muted)}
  .pas[data-st="feito"]{border-top-color:var(--ok)}
  .pas[data-st="feito"] .s{color:var(--ok)}
  .pas[aria-current="true"]{border-top-color:var(--accent);background:var(--accent-soft)}
  .pas[data-op="1"] .n::after{content:" · opcional"}

  .painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    margin-top:16px;overflow:hidden;backdrop-filter:var(--glass)}
  .p-hd{padding:16px 20px;border-bottom:1px solid var(--line)}
  .p-hd h2{font-size:18px;font-weight:600}
  .p-hd p{margin:5px 0 0;color:var(--ink-2);font-size:13.5px;max-width:74ch}
  .p-bd{padding:18px 20px}
  .p-ft{padding:13px 20px;border-top:1px solid var(--line);background:var(--surface-2);
    display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .p-ft .sp{margin-left:auto}

  .btn{font:inherit;font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:var(--radius-pill);cursor:pointer;
    border:1px solid var(--line-2);background:transparent;color:var(--ink);transition:box-shadow .15s,filter .15s,border-color .15s,transform .15s}
  .btn:hover:not(:disabled){border-color:var(--muted)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.primary{background-image:var(--accent-grad);border-color:transparent;color:#fff;
    box-shadow:0 12px 26px -14px rgba(38,89,165,.9)}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08)}
  .btn.verde{background-image:linear-gradient(120deg,#2E7D4F,#5FBF87);border-color:transparent;color:#fff;
    box-shadow:0 12px 26px -14px rgba(46,125,79,.9)}
  .btn.verde:hover:not(:disabled){filter:brightness(1.08)}
  .btn.ghost{background:transparent;border:1px solid var(--line)}
  .btn.mini{padding:5px 13px;font-size:12px}
  input.txt{font:inherit;font-size:14px;padding:9px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);min-width:280px;backdrop-filter:var(--glass)}
  input.txt:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

  .rot{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);display:block;margin-bottom:7px}

  /* grade de artes */
  .artes{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:11px}
  .arte{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px;cursor:pointer;
    text-align:left;font:inherit;color:inherit;display:grid;gap:6px;backdrop-filter:var(--glass)}
  .arte:hover{border-color:var(--muted)}
  .arte:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .arte[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
  .arte img{width:100%;aspect-ratio:1/1.4;object-fit:contain;background:var(--surface-3);border-radius:6px;display:block}
  .arte b{font-size:11.5px;font-weight:500;line-height:1.3;word-break:break-word}
  .arte span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted)}

  /* saída de agente */
  .dupla{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:820px){.dupla{grid-template-columns:1fr}}
  .visual{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px;backdrop-filter:var(--glass)}
  .visual img,.visual canvas{width:100%;display:block;border-radius:6px;background:var(--surface-3)}
  pre.out{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:13px;
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;
    word-break:break-word;max-height:420px;overflow:auto;color:var(--ink-2)}
  pre.out.erro{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
  .resumo{display:grid;gap:8px;margin-bottom:12px}
  .kv{display:flex;gap:9px;align-items:baseline;font-size:13.5px}
  .kv b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);min-width:132px}
  .pilulas{display:flex;gap:5px;flex-wrap:wrap}
  .pil{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-2)}
  .pil.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
  .pil.no{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
  .pil.rm{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
  .swatches{display:flex;gap:4px;flex-wrap:wrap}
  .sw{width:26px;height:26px;border-radius:7px;border:1px solid var(--line-2)}

  /* camadas recortadas */
  .camadas{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .cam{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px;position:relative;
    cursor:pointer;backdrop-filter:var(--glass)}
  .cam[aria-pressed="false"]{opacity:.32}
  .cam canvas{width:100%;aspect-ratio:1;object-fit:contain;display:block;
    background:repeating-conic-gradient(var(--surface-3) 0 25%, transparent 0 50%) 0 0/12px 12px}
  .cam small{display:block;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted)}

  /* máscaras */
  .mascaras{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:10px}
  .msk{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;cursor:pointer;font:inherit;color:inherit;text-align:left;backdrop-filter:var(--glass)}
  .msk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .msk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .msk .box{flex:none;width:38px;height:38px;display:grid;place-items:center}
  .msk .box i{display:block;background:var(--line-2);border-radius:2px}
  .msk[aria-pressed="true"] .box i{background:var(--accent)}
  .msk b{display:block;font-size:13px;font-weight:500}
  .msk span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}

  /* entrega */
  .entrega{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
  .ent{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;backdrop-filter:var(--glass)}
  .ent-hd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
  .ent-hd b{font-size:13px;font-weight:500}
  .ent-hd span{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);margin-left:auto}
  .ent .par{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .ent .par > div{background:var(--surface-2);padding:7px;display:grid;gap:5px}
  .ent .par small{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);text-align:center}
  .ent canvas,.ent img{width:100%;display:block;border-radius:5px;background:var(--surface-3)}
  .ent-ft{padding:8px 12px;display:flex;gap:7px}
  .ent-ft a{font:inherit;font-size:12px;color:var(--accent);text-decoration:underline;cursor:pointer}

  #tresd{width:100%;height:400px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    display:block}
  .d3-bar{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}

  .aviso{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);border-radius:10px;
    padding:11px 14px;font-size:13.5px;margin-bottom:14px}
  .aviso.err{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
  .aviso[hidden]{display:none}
  .aviso code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--code-bg);padding:1px 5px;border-radius:3px}

  .vazio{color:var(--muted);font-size:13.5px;padding:20px 0;text-align:center}
  .carregando{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .spin{width:12px;height:12px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;
    animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--toast-bg);color:var(--ink);
    border:1px solid var(--line);padding:9px 17px;border-radius:999px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);
    max-width:80vw;backdrop-filter:var(--glass)}
  .toast[hidden]{display:none}
  .toast.err{background:var(--crit);color:#fff;border-color:var(--crit)}
  details.crua{margin-top:12px}
  details.crua summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="blob"></span><span class="blob"></span><span class="blob"></span>
  <span class="blob"></span><span class="blob"></span>
</div>
<div class="veil" aria-hidden="true"></div>

<header>
  <div class="hd">
    <div class="brandline">
