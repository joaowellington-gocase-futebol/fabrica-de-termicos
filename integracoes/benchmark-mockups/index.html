<style>
  :root {
    --bg:#0b0d12; --card:#151922; --card2:#1a1f2b; --line:#242b39; --line2:#2f3849;
    --fg:#eef1f6; --mut:#9aa5b8; --dim:#6b7688; --acc:#6f8bff; --acc2:#9b7bff;
    --purple:#7c3aed; --purple2:#a855f7; --ok:#38d39f; --err:#ff6b6b;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; color:var(--fg); -webkit-font-smoothing:antialiased; display:flex; min-height:100vh;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(111,139,255,.14), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(155,123,255,.10), transparent 55%), var(--bg);
  }

  /* ---- sidebar ---- */
  aside { position:fixed; top:0; left:0; z-index:10; width:230px; height:100vh; overflow-y:auto; border-right:1px solid var(--line); padding:20px 14px; background:rgba(11,13,18,.92); backdrop-filter:blur(8px); }
  .brand { display:flex; align-items:center; gap:11px; padding:0 6px 16px; }
  .logo { width:34px; height:34px; border-radius:9px; flex:none; background:linear-gradient(135deg, var(--acc), var(--acc2)); display:grid; place-items:center; font-size:18px; box-shadow:var(--shadow); }
  h1 { font-size:15px; margin:0; font-weight:650; } .brand .tag { font-size:11px; color:var(--dim); margin-top:1px; }
  .navlabel { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); padding:8px 8px 6px; }
  .navbtn { width:100%; text-align:left; border:0; background:transparent; color:var(--mut); font:inherit; font-weight:600; padding:10px 11px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:2px; }
  .navbtn:hover { background:var(--card); color:var(--fg); }
  .navbtn.active { background:linear-gradient(135deg, rgba(111,139,255,.18), rgba(155,123,255,.14)); color:var(--fg); border:1px solid var(--line2); }
  .navbtn .badge { font-size:11px; font-weight:600; color:var(--dim); background:var(--card2); border:1px solid var(--line); border-radius:999px; padding:1px 8px; }

  /* ---- main ---- */
  main { flex:1; min-width:0; margin-left:230px; padding:22px 26px 60px; }
  .dashhead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; color:var(--mut); font-size:13px; }
  .pill { display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; }
  .pill b { color:var(--fg); font-weight:650; }
  a.src { color:var(--acc); text-decoration:none; } a.src:hover { text-decoration:underline; }
  .note { color:var(--dim); font-size:12px; margin:0 0 18px; }

  /* ---- barra de captação do Pinterest ---- */
  .pinbar { flex-basis:100%; display:flex; gap:8px; margin-bottom:4px; }
  .pininput { flex:1; min-width:0; background:var(--card); border:1px solid var(--line2); color:var(--fg); font:inherit; font-size:13px; padding:9px 12px; border-radius:10px; }
  .pininput:focus { outline:none; border-color:var(--acc); }
  .pincapbtn { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-weight:650; font-size:13px; border:0; border-radius:10px; padding:9px 16px; cursor:pointer; white-space:nowrap; }
  .pincapbtn:disabled { opacity:.6; cursor:default; }
  .headactions { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .dlallbtn { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-weight:650; font-size:12.5px; border:0; border-radius:10px; padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; box-shadow:0 5px 16px rgba(111,139,255,.4); }
  .dlallbtn:hover:not(:disabled) { filter:brightness(1.08); }
  .dlallbtn:disabled { opacity:.4; cursor:default; box-shadow:none; }
  /* botão "Atualizar agora" — puxa estampas novas do site pra aba atual */
  .refreshbtn { background:var(--card2); color:var(--fg); font-weight:650; font-size:12.5px; border:1px solid var(--line2); border-radius:10px; padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .refreshbtn:hover:not(:disabled) { border-color:var(--acc); color:var(--acc); }
  .refreshbtn:disabled { opacity:.5; cursor:default; }
  /* botão "Atualizar todas" na sidebar — recaptura todas as marcas de uma vez (exceto Gocase) */
  .refreshallbtn { width:100%; margin-bottom:10px; background:var(--card2); color:var(--fg); font-weight:650; font-size:12px; border:1px solid var(--line2); border-radius:10px; padding:9px 10px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; text-align:center; }
  .refreshallbtn:hover:not(:disabled) { border-color:var(--acc); color:var(--acc); }
  .refreshallbtn:disabled { opacity:.55; cursor:default; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(440px,1fr)); gap:16px; }
  .item { display:grid; grid-template-columns:1fr 1fr; gap:0; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .left { padding:12px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:9px; min-width:0; }
  .right { padding:12px; display:flex; flex-direction:column; gap:9px; min-width:0; }

  .thumb { position:relative; aspect-ratio:1/1; background:#fff; border-radius:11px; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:contain; display:block; }
  .rank { position:absolute; top:8px; left:8px; background:linear-gradient(135deg, var(--acc), var(--acc2)); color:#fff; font-size:12px; font-weight:700; border-radius:8px; padding:3px 9px; box-shadow:var(--shadow); }
  .brandtag { position:absolute; top:8px; right:8px; background:rgba(21,25,34,.9); border:1px solid var(--line2); color:var(--mut); font-size:11px; font-weight:600; border-radius:8px; padding:3px 9px; }
  .prompt { font-size:11.5px; line-height:1.5; color:#cfd6e4; background:#10141c; border:1px solid var(--line); border-radius:10px; padding:9px 10px; white-space:pre-wrap; word-break:break-word; max-height:150px; overflow:auto; flex:1; }
  .prompt.empty { color:var(--dim); font-style:italic; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .row a { color:var(--acc); text-decoration:none; font-size:12px; } .row a:hover { text-decoration:underline; }
  .mini { font:inherit; font-size:11px; color:var(--mut); background:var(--card2); border:1px solid var(--line2); border-radius:7px; padding:4px 8px; cursor:pointer; }
  .mini:hover { color:var(--fg); }

  .genlabel { font-size:11px; color:var(--dim); }
  .genslot { aspect-ratio:9/16; background:#0e1219; border:1px solid var(--line); border-radius:11px; overflow:hidden; display:grid; place-items:center; }
  .genslot img { width:100%; height:100%; object-fit:cover; display:block; }
  .genph { color:var(--dim); font-size:12px; text-align:center; padding:0 12px; } .genph.err { color:var(--err); }
  /* botão de download — ação principal, largura total, mesmo gradiente das posições */
  .dl { width:100%; display:inline-flex; align-items:center; justify-content:center; gap:7px; text-decoration:none;
        background:linear-gradient(135deg, var(--acc), var(--acc2)); color:#fff; font-weight:650; font-size:12.5px;
        border:0; border-radius:10px; padding:8px 14px; cursor:pointer; box-shadow:0 5px 16px rgba(111,139,255,.4); transition:filter .15s ease, transform .06s ease; }
  .dl:hover { filter:brightness(1.08); } .dl:active { transform:translateY(1px); }
  .dl[aria-disabled="true"] { opacity:.45; pointer-events:none; box-shadow:none; }

  /* botão de checklist — marca a estampa como já cadastrada e some do quadro */
  .ckbtn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px;
        background:transparent; color:var(--ok); font-weight:650; font-size:12.5px;
        border:1px solid var(--ok); border-radius:10px; padding:8px 10px; cursor:pointer; transition:background .15s ease, transform .06s ease; }
  .ckbtn:hover:not(:disabled) { background:rgba(56,211,159,.12); } .ckbtn:active:not(:disabled) { transform:translateY(1px); }
  .ckbtn:disabled { opacity:.55; cursor:default; }
  /* botão de descartar — estampa feia/errada, vai pro Lixo e some do quadro */
  .trashbtn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px;
        background:transparent; color:var(--err); font-weight:650; font-size:12.5px;
        border:1px solid var(--err); border-radius:10px; padding:8px 10px; cursor:pointer; transition:background .15s ease, transform .06s ease; }
  .trashbtn:hover:not(:disabled) { background:rgba(255,107,107,.12); } .trashbtn:active:not(:disabled) { transform:translateY(1px); }
  .trashbtn:disabled { opacity:.55; cursor:default; }
  .actions2 { display:flex; gap:8px; }
  /* botão de desfazer/restaurar, nas abas de adaptações feitas e lixo */
  .undobtn { width:100%; display:inline-flex; align-items:center; justify-content:center; gap:7px;
        background:var(--card2); color:var(--mut); font-weight:600; font-size:12.5px; border:1px solid var(--line2); border-radius:10px; padding:8px 14px; cursor:pointer; }
  .undobtn:hover:not(:disabled) { color:var(--fg); border-color:var(--acc); }
  .undobtn:disabled { opacity:.55; cursor:default; }

  .spin { display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .empty { text-align:center; color:var(--mut); padding:70px 16px; } .empty .ico { font-size:34px; opacity:.7; }
  .skeleton { display:grid; grid-template-columns:repeat(auto-fill, minmax(440px,1fr)); gap:16px; }
  .sk { height:340px; border-radius:16px; background:linear-gradient(100deg,#141922 30%,#1b2231 50%,#141922 70%); background-size:200% 100%; animation:sh 1.1s infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--card2); border:1px solid var(--line2); color:var(--fg); padding:11px 16px; border-radius:12px; box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:760px){ body{flex-direction:column;} aside{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);} main{margin-left:0;} .item{grid-template-columns:1fr;} .left{border-right:0;border-bottom:1px solid var(--line);} }
</style>

<aside>
  <div class="brand">
    <div class="logo">📸</div>
    <div><h1>Benchmark</h1><div class="tag">Mockups & estampas IA</div></div>
  </div>
  <button id="refreshAllBtn" class="refreshallbtn" title="Recaptura todas as marcas, exceto Gocase (captura quebrada)">🔄 Atualizar todas (exceto Gocase)</button>
  <div class="navlabel">Marcas</div>
  <nav id="nav"></nav>
</aside>

<main>
  <div id="dashhead" class="dashhead"></div>
  <p class="note" id="note">Posição (#1, #2…) = ordem no site (ranking de mais vendidos). À esquerda o mockup + prompt da estampa; à direita a estampa 9:16 gerada só a partir do prompt.</p>
  <div id="skeleton" class="skeleton" style="display:none"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none"><div class="ico">🗓️</div><p>Ainda sem captura desta marca.</p></div>
</main>

<div id="toast" class="toast"></div>

<script>
  const $ = (s) => document.querySelector(s);
  let brands = [], active = null, token = 0, toastT;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1700); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  function fmt(d) { return d ? new Date(d).toLocaleString('pt-BR') : '—'; }

  // ---- baixar estampas em .zip (client-side, sem dependência: método STORE + CRC32) ----
  let curItems = [], curKey = '', curName = '', readyIds = new Set(), dlBusy = false;
  function slugify(s) { return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'estampa'; }
  function crc32(buf) {
    let t = crc32.t;
    if (!t) { t = crc32.t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ t[(crc ^ buf[i]) & 0xFF];
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(files) {
    const enc = new TextEncoder();
    const u16 = (n) => [n & 0xFF, (n >>> 8) & 0xFF];
    const u32 = (n) => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];
    const parts = [], central = []; let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name); const crc = crc32(f.data); const size = f.data.length;
      const local = new Uint8Array([].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0), u32(crc), u32(size), u32(size), u16(name.length), u16(0)));
      parts.push(local, name, f.data);
      central.push(new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0), u32(crc), u32(size), u32(size), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset))), name);
      offset += local.length + name.length + size;
    }
    let cdSize = 0; for (const c of central) cdSize += c.length;
    const eocd = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cdSize), u32(offset), u16(0)));
    return new Blob([...parts, ...central, eocd], { type: 'application/zip' });
  }
  function estampaName(it, ext, id) {
    const pos = it && it.position != null ? String(it.position).padStart(2, '0') : String(id);
    let slug = 'estampa';
    if (curKey === 'pinterest') { const m = ((it && it.product_url) || '').match(/\/pin\/([^/?#]+)/); slug = m ? 'pin-' + m[1] : 'pin'; }
    else { const m = ((it && it.product_url) || '').match(/\/products?\/([^/?#]+)/); slug = m ? slugify(m[1]) : slugify((it && it.product_url) || ''); }
    return pos + '-' + slug + '.' + ext;
  }
  function refreshDlAll() {
    const b = $('#dlall'); if (!b) return;
    b.disabled = dlBusy || readyIds.size === 0;
    b.innerHTML = dlBusy ? '<span class="spin"></span>compactando…' : ('⬇ Baixar todas as estampas' + (readyIds.size ? ' (' + readyIds.size + ')' : ''));
  }
  async function downloadAll() {
    if (dlBusy || !readyIds.size) return;
    dlBusy = true; refreshDlAll();
    const ids = [...readyIds];
    const byId = {}; curItems.forEach((i) => { byId[i.id] = i; });
    const results = new Array(ids.length); let idx = 0, fails = 0;
    const worker = async () => {
      while (idx < ids.length) {
        const i = idx++; const id = ids[i];
        try {
          const r = await fetch('/img?id=' + id);
          if (!r.ok) { fails++; continue; }
          const blob = await r.blob();
          const buf = new Uint8Array(await blob.arrayBuffer());
          const ext = (blob.type || '').includes('jpeg') ? 'jpg' : 'png';
          results[i] = { name: slugify(curName || curKey) + '/' + estampaName(byId[id], ext, id), data: buf };
        } catch (e) { fails++; }
      }
    };
    await Promise.all(Array.from({ length: Math.min(6, ids.length) }, worker));
    const files = results.filter(Boolean);
    dlBusy = false; refreshDlAll();
    if (!files.length) { toast('Nenhuma estampa pôde ser baixada'); return; }
    const blob = makeZip(files);
    const date = new Date().toISOString().slice(0, 10);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'estampas-' + slugify(curName || curKey) + '-' + date + '.zip';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast(files.length + ' estampa(s) baixada(s)' + (fails ? ' · ' + fails + ' falhou(aram)' : ''));
  }

  function renderNav() {
    const marcas = brands.filter((b) => b.kind !== 'pinterest' && b.kind !== 'cataloged' && b.kind !== 'discarded');
    const fontes = brands.filter((b) => b.kind === 'pinterest');
    const managed = brands.filter((b) => b.kind === 'cataloged' || b.kind === 'discarded');
    const btn = (b, label) => `<button class="navbtn${b.key===active?' active':''}" data-k="${b.key}">${label != null ? label : esc(b.name)}<span class="badge">${b.count}</span></button>`;
    let html = marcas.map((b) => btn(b)).join('');
    if (fontes.length) html += '<div class="navlabel" style="margin-top:12px">Fontes</div>' + fontes.map((b) => btn(b)).join('');
    if (managed.length) html += '<div class="navlabel" style="margin-top:12px">Gerenciar</div>' + managed.map((b) => btn(b, (b.kind === 'discarded' ? '🗑️ ' : '✅ ') + esc(b.name))).join('');
    $('#nav').innerHTML = html;
    document.querySelectorAll('.navbtn').forEach((t) => t.onclick = () => selectBrand(t.dataset.k));
  }
  function showSkeleton(on) {
    $('#skeleton').style.display = on ? 'grid' : 'none';
    if (on) { $('#skeleton').innerHTML = Array.from({length:6}).map(()=>'<div class="sk"></div>').join(''); $('#grid').innerHTML=''; $('#empty').style.display='none'; }
  }

  function makeQueue(max) {
    const q = []; let running = 0;
    const pump = () => { while (running < max && q.length) { const t = q.shift(); running++; t().finally(() => { running--; pump(); }); } };
    return { push: (t) => { q.push(t); pump(); }, clear: () => { q.length = 0; } };
  }
  const promptQ = makeQueue(4);
  const imageQ = makeQueue(2);

  function genPrompt(id) {
    return fetch('/api/prompt', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id }) })
      .then((r) => r.json()).then((d) => d.prompt || null).catch(() => null);
  }

  function showGenerated(fig, id) {
    const slot = fig.querySelector('[data-genslot]');
    slot.innerHTML = '<img loading="lazy" src="/img?id=' + id + '&t=' + Date.now() + '" alt="" />';
    const dl = fig.querySelector('[data-dl]'); if (dl) dl.setAttribute('aria-disabled', 'false');
    readyIds.add(id); refreshDlAll();
  }

  async function driveImage(id, fig, myToken) {
    const slot = fig.querySelector('[data-genslot]');
    for (let i = 0; i < 40 && myToken === token; i++) {
      let d;
      try { d = await fetch('/api/generate', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id }) }).then((r) => r.json()); }
      catch (e) { await sleep(12000); continue; }
      if (myToken !== token) return;
      if (d.status === 'completed') { showGenerated(fig, id); return; }
      if (d.status === 'failed') { slot.innerHTML = '<div class="genph err">falhou na geração</div>'; return; }
      if (d.error && !d.status) { slot.innerHTML = '<div class="genph err">' + esc(d.error) + '</div>'; return; }
      if (d.status === 'need_prompt') { slot.innerHTML = '<div class="genph">aguardando prompt…</div>'; return; }
      await sleep(12000);
    }
  }

  async function capturePinterest() {
    const inp = $('#pinurl'); if (!inp) return;
    const url = inp.value.trim();
    if (!url) return toast('Cole uma URL do Pinterest');
    const btn = $('#pincap'); btn.disabled = true; const old = btn.textContent; btn.innerHTML = '<span class="spin"></span>captando…';
    try {
      const r = await fetch('/api/pinterest', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ url }) });
      const d = await r.json();
      if (!r.ok) { toast(d.error || 'falha na captação'); btn.disabled = false; btn.textContent = old; return; }
      toast(d.count + ' imagem(ns) captada(s)');
      selectBrand('pinterest');
    } catch (e) { toast('erro de rede'); btn.disabled = false; btn.textContent = old; }
  }

  // marca/descarta uma estampa (cataloga ou joga no lixo) — some do quadro da marca e vai pra aba correspondente (ou volta, no caso de desfazer/restaurar)
  const FLAG_INFO = {
    catalog: { endpoint: '/api/catalog', targetKey: '__cataloged__', onSel: '[data-catalog]', offSel: '[data-uncatalog]', onMsg: 'Estampa marcada como cadastrada', offMsg: 'Estampa devolvida ao quadro' },
    discard: { endpoint: '/api/discard', targetKey: '__discarded__', onSel: '[data-discard]', offSel: '[data-restore]', onMsg: 'Estampa descartada', offMsg: 'Estampa restaurada' },
  };
  async function setFlag(kind, id, fig, value) {
    const info = FLAG_INFO[kind];
    const btn = fig.querySelector(value ? info.onSel : info.offSel);
    const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>salvando…';
    try {
      const r = await fetch(info.endpoint, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id, value }) });
      if (!r.ok) throw new Error();
      fig.remove();
      readyIds.delete(id); refreshDlAll();
      const originKey = value ? active : (fig.dataset.brand || null);
      const originBrand = brands.find((x) => x.key === originKey);
      if (originBrand) originBrand.count = Math.max(0, originBrand.count + (value ? -1 : 1));
      const target = brands.find((x) => x.key === info.targetKey);
      if (target) target.count = Math.max(0, target.count + (value ? 1 : -1));
      renderNav();
      toast(value ? info.onMsg : info.offMsg);
      if (!$('#grid').children.length) $('#empty').style.display = 'block';
    } catch (e) { toast('Falha ao salvar'); btn.disabled = false; btn.innerHTML = old; }
  }

  async function selectBrand(key) {
    active = key; token++; const myToken = token;
    promptQ.clear(); imageQ.clear();
    renderNav(); showSkeleton(true);
    let d;
    const endpoint = key === '__cataloged__' ? '/api/cataloged' : key === '__discarded__' ? '/api/discarded' : ('/api/brand?key=' + encodeURIComponent(key));
    try { d = await fetch(endpoint).then((r) => r.json()); }
    catch (e) { showSkeleton(false); $('#dashhead').innerHTML = '<span class="pill">Erro ao carregar</span>'; return; }
    if (myToken !== token) return;
    showSkeleton(false);
    const items = d.items || [];
    const isPin = d.kind === 'pinterest';
    const isCat = d.kind === 'cataloged';
    const isTrash = d.kind === 'discarded';

    if (isPin) {
      $('#dashhead').innerHTML =
        '<div class="pinbar"><input id="pinurl" class="pininput" placeholder="Cole a URL do board ou pin do Pinterest (ex: https://br.pinterest.com/user/board/)" /><button id="pincap" class="pincapbtn">Captar imagens</button></div>' +
        '<span class="pill">📌 <b>' + items.length + '</b> imagens</span>' +
        (d.captured_at ? '<span class="pill">🕗 ' + fmt(d.captured_at) + '</span>' : '');
      $('#note').textContent = 'Cole um board (várias imagens, até 30) ou um pin (uma imagem). O sistema extrai em alta resolução, gera o prompt de cada imagem e a estampa 9:16 — igual ao fluxo das marcas.';
      $('#pincap').onclick = capturePinterest;
      $('#pinurl').addEventListener('keydown', (e) => { if (e.key === 'Enter') capturePinterest(); });
      $('#empty').querySelector('p').textContent = 'Ainda sem captura desta marca.';
      $('#empty').style.display = 'none';
    } else if (isCat) {
      $('#dashhead').innerHTML = '<span class="pill">✅ <b>' + items.length + '</b> estampas cadastradas</span>';
      $('#note').textContent = 'Estampas já marcadas como cadastradas — somem do quadro das marcas para não cadastrar de novo. Use "↩ desfazer" para trazer uma de volta.';
      $('#empty').querySelector('p').textContent = 'Nenhuma estampa cadastrada ainda.';
      $('#empty').style.display = items.length ? 'none' : 'block';
    } else if (isTrash) {
      $('#dashhead').innerHTML = '<span class="pill">🗑️ <b>' + items.length + '</b> estampas descartadas</span>';
      $('#note').textContent = 'Estampas descartadas por terem ficado feias/erradas — somem do quadro das marcas. Use "↩ restaurar" para trazer uma de volta.';
      $('#empty').querySelector('p').textContent = 'Nenhuma estampa descartada ainda.';
      $('#empty').style.display = items.length ? 'none' : 'block';
    } else {
      $('#dashhead').innerHTML =
        '<span class="pill">🏷️ <b>' + esc(d.name||'') + '</b></span>' +
        '<span class="pill">🖼️ <b>' + items.length + '</b> mockups</span>' +
        '<span class="pill">🕗 atualizado ' + fmt(d.captured_at) + '</span>' +
        '<a class="src" href="' + esc(d.url||'#') + '" target="_blank" rel="noopener">abrir coleção ↗</a>';
      $('#note').textContent = 'Posição (#1, #2…) = ordem no site (ranking de mais vendidos). À esquerda o mockup + prompt da estampa; à direita a estampa 9:16 gerada só a partir do prompt. "Atualizar agora" puxa estampas novas do site (até 30 em aberto por vez) — estampas já cadastradas ou descartadas não voltam.';
      $('#empty').querySelector('p').textContent = 'Ainda sem captura desta marca.';
      $('#empty').style.display = items.length ? 'none' : 'block';
    }

    curItems = items; curKey = key; curName = isPin ? 'pinterest' : (isCat ? 'cadastradas' : (isTrash ? 'descartadas' : (d.name || key)));
    readyIds = new Set(items.filter((i) => i.gen_status === 'completed').map((i) => i.id));
    const isBrandTab = !isPin && !isCat && !isTrash;
    $('#dashhead').insertAdjacentHTML('beforeend', '<div class="headactions">' +
      (isBrandTab ? '<button id="refreshbrand" class="refreshbtn">🔄 Atualizar agora</button>' : '') +
      '<button id="dlall" class="dlallbtn" disabled></button></div>');
    $('#dlall').onclick = downloadAll;
    refreshDlAll();
    if (isBrandTab) {
      const refreshBtn = $('#refreshbrand');
      refreshBtn.onclick = async () => {
        refreshBtn.disabled = true; const old = refreshBtn.innerHTML; refreshBtn.innerHTML = '<span class="spin"></span>atualizando…';
        try {
          const r = await fetch('/api/refresh', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ key }) });
          const dd = await r.json();
          if (!r.ok) { toast(dd.error || 'falha ao atualizar'); refreshBtn.disabled = false; refreshBtn.innerHTML = old; return; }
          const skippedMsg = dd.skipped_already_reviewed ? (' · ' + dd.skipped_already_reviewed + ' já revisada(s) ignorada(s)') : '';
          toast((dd.count || 0) + ' estampa(s) em aberto' + skippedMsg);
          if (myToken === token) selectBrand(key);
        } catch (e) { toast('erro de rede ao atualizar'); refreshBtn.disabled = false; refreshBtn.innerHTML = old; }
      };
    }

    $('#grid').innerHTML = items.map((i) => {
      const u = esc(i.image_url), p = esc(i.product_url || i.image_url), pos = i.position != null ? '#' + i.position : '';
      const hasPrompt = !!i.prompt;
      const done = i.gen_status === 'completed';
      const genInner = done ? '<img loading="lazy" src="/img?id=' + i.id + '" alt="" />' : '<div class="genph"><span class="spin"></span>gerando…</div>';
      const brandTag = (isCat || isTrash) && i.brand_name ? '<span class="brandtag">' + esc(i.brand_name) + '</span>' : '';
      const actionBtn = isCat
        ? '<button class="undobtn" data-uncatalog>↩ Desfazer</button>'
        : isTrash
        ? '<button class="undobtn" data-restore>↩ Restaurar</button>'
        : '<div class="actions2"><button class="ckbtn" data-catalog>☑ Já cadastrada</button><button class="trashbtn" data-discard>🗑 Descartar</button></div>';
      return '<div class="item" data-id="' + i.id + '" data-brand="' + esc(i.brand || curKey) + '">' +
        '<div class="left">' +
          '<div class="thumb">' + (pos ? '<span class="rank">' + pos + '</span>' : '') + brandTag + '<img loading="lazy" src="' + u + '" alt="" /></div>' +
          '<div class="prompt' + (hasPrompt ? '' : ' empty') + '"' + (hasPrompt ? ' data-prompt="' + esc(i.prompt) + '"' : '') + '>' +
            (hasPrompt ? esc(i.prompt) : '<span class="spin"></span>gerando prompt da estampa…') + '</div>' +
          '<div class="row"><a href="' + p + '" target="_blank" rel="noopener">' + (isPin ? 'ver no Pinterest ↗' : 'ver produto ↗') + '</a>' +
            '<button class="mini" data-copy-prompt>copiar prompt</button></div>' +
        '</div>' +
        '<div class="right">' +
          '<div class="genslot" data-genslot>' + genInner + '</div>' +
          '<div class="genlabel">Estampa gerada · IA · 9:16</div>' +
          '<a class="dl" data-dl href="/img?id=' + i.id + '" download="estampa-' + i.id + '.png"' + (done ? '' : ' aria-disabled="true"') + '>⬇ Baixar</a>' +
          actionBtn +
        '</div>' +
      '</div>';
    }).join('');

    document.querySelectorAll('.item[data-id]').forEach((fig) => {
      const id = Number(fig.dataset.id);
      const promptEl = fig.querySelector('.prompt');
      const startImage = () => imageQ.push(async () => { if (myToken === token) await driveImage(id, fig, myToken); });
      const alreadyDone = !!fig.querySelector('[data-genslot] img');
      const hasPrompt = !promptEl.classList.contains('empty');
      if (!isCat && !isTrash) {
        if (!hasPrompt) {
          promptQ.push(async () => {
            if (myToken !== token) return;
            const txt = await genPrompt(id);
            if (myToken !== token) return;
            if (txt) { promptEl.textContent = txt; promptEl.classList.remove('empty'); promptEl.dataset.prompt = txt; startImage(); }
            else { promptEl.textContent = 'Falha ao gerar prompt'; }
          });
        } else if (!alreadyDone) { startImage(); }
        else {
          // estampa já veio marcada como pronta — se a imagem falhar ao carregar (geração
          // anterior quebrada), corrige sozinha disparando uma nova geração
          const doneImg = fig.querySelector('[data-genslot] img');
          doneImg.addEventListener('error', () => {
            if (fig.dataset.retriedImg) return; fig.dataset.retriedImg = '1';
            fig.querySelector('[data-genslot]').innerHTML = '<div class="genph"><span class="spin"></span>corrigindo estampa…</div>';
            const dl = fig.querySelector('[data-dl]'); if (dl) dl.setAttribute('aria-disabled', 'true');
            readyIds.delete(id); refreshDlAll();
            startImage();
          }, { once: true });
        }
      }

      fig.querySelector('[data-copy-prompt]').onclick = () => { const t = promptEl.dataset.prompt; if (!t) return toast('Prompt ainda não gerado'); navigator.clipboard.writeText(t).then(() => toast('Prompt copiado')); };

      const catBtn = fig.querySelector('[data-catalog]');
      if (catBtn) catBtn.onclick = () => setFlag('catalog', id, fig, true);
      const undoBtn = fig.querySelector('[data-uncatalog]');
      if (undoBtn) undoBtn.onclick = () => setFlag('catalog', id, fig, false);
      const discardBtn = fig.querySelector('[data-discard]');
      if (discardBtn) discardBtn.onclick = () => setFlag('discard', id, fig, true);
      const restoreBtn = fig.querySelector('[data-restore]');
      if (restoreBtn) restoreBtn.onclick = () => setFlag('discard', id, fig, false);
    });
  }

  $('#refreshAllBtn').onclick = async () => {
    const btn = $('#refreshAllBtn'); btn.disabled = true; const old = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>atualizando marcas…';
    try {
      const r = await fetch('/api/refresh-all', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ exclude: ['gocase'] }) });
      const d = await r.json();
      if (!r.ok) { toast(d.error || 'falha ao atualizar'); }
      else {
        const entries = Object.entries(d.brands || {});
        const ok = entries.filter(([, v]) => v && v.status === 200).length;
        const newCount = entries.reduce((s, [, v]) => s + (v && v.count ? v.count : 0), 0);
        toast('Atualização concluída: ' + ok + '/' + entries.length + ' marcas · ' + newCount + ' estampa(s) nova(s)');
      }
    } catch (e) { toast('erro de rede ao atualizar'); }
    btn.disabled = false; btn.innerHTML = old;
    try { const d2 = await fetch('/api/brands').then((r) => r.json()); brands = d2.brands || []; renderNav(); } catch (e) {}
    if (active) selectBrand(active);
  };

  (async () => {
    try {
      const d = await fetch('/api/brands').then((r) => r.json());
      brands = d.brands || [];
      renderNav();
      if (brands.length) selectBrand((brands.find((b) => b.kind !== 'cataloged' && b.kind !== 'discarded' && b.count > 0) || brands[0]).key);
    } catch (e) { $('#nav').innerHTML = '<div style="color:var(--mut);padding:12px">Erro ao carregar</div>'; }
  })();
</script>
